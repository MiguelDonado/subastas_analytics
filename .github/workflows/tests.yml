# Runs the tests on every pull request to main, and on every push to main.
# A pull request can only be merged if all three jobs pass, once the ruleset
# requires them (docs/5.ci_cd.md)
name: tests

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    unit-and-integration:
        # Github Ubuntu machines come with Docker, so testcontainers can start Postgres here too
        runs-on: ubuntu-latest
        steps:
            # Copy our repo into the runner (fresh venv)
            - uses: actions/checkout@v4

            # Installs uv. `uv sync` then installs Python 3.12 (from .python-version) and the dev dependencies
            - uses: astral-sh/setup-uv@v6
            - run: uv sync

            - run: uv run pytest

    dags:
        # Separate job: it needs the Astro CLI and builds the Airflow image
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install the Astro CLI
              run: curl -sSL install.astronomer.io | sudo bash -s

            # .env is out of git (it has the API keys). The DAG tests don't need any of it, since every
            # API is faked, but astro dev pytest looks for the file
            - run: touch .env

            - run: astro dev pytest tests/dags

    e2e:
        # End-to-end tests of the Shiny app. Docker and Google Chrome come with GitHub's Ubuntu machines.
        # setup.R starts a blank Postgres, creates the tables with include/sql/create_gold.sql,
        # create_app.sql and create_app_role.sql, and loads the rows of dashboard/tests/e2e_data.sql
        # Pinned, not ubuntu-latest: the binaries URL below is for this Ubuntu version (noble)
        runs-on: ubuntu-24.04
        defaults:
            run:
                # Every run step starts in dashboard/, so its .Rprofile activates renv
                working-directory: dashboard
        steps:
            # Copy our repo into the runner
            - uses: actions/checkout@v4

            # R, the same version as renv.lock
            - uses: r-lib/actions/setup-r@v2
              with:
                  r-version: 4.6.2
                  use-public-rspm: true

            # System libraries of the app's packages: the list renv printed on the first run,
            # plus libpq (RPostgres) and libsodium (sodium). Ready-built packages still use them.
            # apt-get update first: the runner's list of packages can be out of date
            - run: >
                sudo apt-get update && sudo apt-get install -y
                libpq-dev libsodium-dev cmake gdal-bin libcurl4-openssl-dev libgdal-dev
                libgeos-dev libpng-dev libproj-dev libudunits2-dev libuv1-dev pandoc

            # Install the packages of renv.lock, and caches them for the next runs
            - uses: r-lib/actions/setup-renv@v2
              with:
                  working-directory: dashboard
              env:
                  # renv.lock records CRAN, which only has source code for Linux, so every package
                  # would be compiled. This makes renv use Posit's ready-built binaries for
                  # Ubuntu 24.04 instead. The versions are still the ones in renv.lock
                  RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/latest

            - name: Run the e2e tests
              run:  Rscript -e 'shinytest2::test_app(".")'
              env:
                  # Without it, shinytest2 thinks it may be on CRAN's servers and skips every test
                  NOT_CRAN: true
